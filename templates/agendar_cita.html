{% extends 'base.html' %}

{% block title %}Agendar Cita{% endblock %}

{% block content %}
<section class="card">
    <h2>Agendar cita</h2>

    {% if horarios %}
        <form method="POST">
            <label for="horario_id">Selecciona un horario disponible</label>
            <select name="horario_id" id="horario_id" required>
                <option value="">Seleccione un horario</option>
                {% for horario in horarios %}
                <option value="{{ horario.id }}"
                        data-profesional-id="{{ horario.profesional_id }}">
                    {{ horario.profesional_nombre }} - {{ horario.especialidad }} |
                    {{ horario.fecha }} | {{ horario.hora_inicio }} - {{ horario.hora_fin }}
                </option>
                {% endfor %}
            </select>

            <input type="hidden" name="profesional_id" id="profesional_id">

            <label for="motivo">Motivo de la cita</label>
            <textarea name="motivo" id="motivo" rows="4" required></textarea>

            <button type="submit" class="btn">Agendar cita</button>
        </form>
    {% else %}
        <p>No hay horarios disponibles en este momento.</p>
    {% endif %}
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const horarioSelect = document.getElementById('horario_id');
    const profesionalInput = document.getElementById('profesional_id');

    if (horarioSelect) {
        horarioSelect.addEventListener('change', function() {
            const selectedOption = horarioSelect.options[horarioSelect.selectedIndex];
            profesionalInput.value = selectedOption.getAttribute('data-profesional-id') || '';
        });
    }
});
</script>
{% endblock %}
