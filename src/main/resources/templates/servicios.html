<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios | Plataforma Citas</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>Plataforma Citas</h2>
        <a href="/admin/dashboard">🏠 Dashboard</a>
        <a href="/logout">🚪 Cerrar sesión</a>
    </aside>

    <main class="main-content">

        <section class="header">
            <div>
                <h1>Servicios</h1>
                <p>Servicios disponibles para agendamiento de citas.</p>
            </div>
        </section>

        <section class="card">
            <h2>Listado de servicios</h2>

            <table>
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Duración</th>
                    <th>Precio</th>
                    <th>Estado</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="servicio : ${servicios}">
                    <td th:text="${servicio.nombre}">Servicio</td>
                    <td th:text="${servicio.descripcion}">Descripción</td>
                    <td th:text="${servicio.duracionMinutos + ' min'}">Duración</td>
                    <td th:text="${'$' + servicio.precio}">Precio</td>
                    <td>
                        <span class="badge badge-completada" th:if="${servicio.activo}">Activo</span>
                        <span class="badge badge-cancelada" th:if="${!servicio.activo}">Inactivo</span>
                    </td>
                </tr>

                <tr th:if="${servicios == null or #lists.isEmpty(servicios)}">
                    <td colspan="5">No hay servicios registrados.</td>
                </tr>
                </tbody>
            </table>
        </section>

    </main>

</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
