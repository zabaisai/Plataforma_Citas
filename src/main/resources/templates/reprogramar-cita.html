<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reprogramar cita | Plataforma Citas</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>Plataforma Citas</h2>
        <a href="/cliente/dashboard">🏠 Volver al panel</a>
        <a href="/logout">🚪 Cerrar sesión</a>
    </aside>

    <main class="main-content">

        <section class="header">
            <div>
                <h1>Reprogramar cita</h1>
                <p>Selecciona una nueva fecha y hora disponible.</p>
            </div>
        </section>

        <section class="card">
            <h2>Datos actuales</h2>

            <p><strong>Servicio:</strong> <span th:text="${cita.servicio.nombre}">Servicio</span></p>
            <p><strong>Profesional:</strong> <span th:text="${cita.profesional.usuario.nombre}">Profesional</span></p>
            <p><strong>Fecha actual:</strong> <span th:text="${cita.fecha}">Fecha</span></p>
            <p><strong>Hora actual:</strong> <span th:text="${cita.hora}">Hora</span></p>
            <p><strong>Estado:</strong> <span th:text="${cita.estado}">Estado</span></p>
        </section>

        <section class="card">
            <h2>Nueva programación</h2>

            <form th:action="@{/cliente/citas/{id}/reprogramar(id=${cita.id})}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nueva fecha</label>
                        <input type="date" name="fecha" required>
                    </div>

                    <div class="form-group">
                        <label>Nueva hora</label>
                        <input type="time" name="hora" required>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="btn-primary">Guardar nueva fecha</button>
                    </div>
                </div>
            </form>
        </section>

    </main>

</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
