<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro | Plataforma Citas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>Crear cuenta</h1>
        <p>Regístrate como cliente para agendar tus citas.</p>

        <div class="alert-error" th:if="${error}" th:text="${error}"></div>

        <form method="post" action="/registro">
            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" name="telefono" placeholder="3001234567" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Crea una contraseña" required>
            </div>

            <button type="submit" class="btn-primary">Registrarme</button>
        </form>

        <a class="auth-link" href="/login">Ya tengo cuenta</a>
    </div>
</div>

</body>
</html>
