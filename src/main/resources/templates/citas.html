<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas | Plataforma Citas</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>Plataforma Citas</h2>
        <a href="/admin/dashboard">🏠 Dashboard</a>
        <a href="/logout">🚪 Cerrar sesión</a>
    </aside>

    <main class="main-content">

        <section class="header">
            <div>
                <h1>Gestión de citas</h1>
                <p>Consulta general de las citas registradas en el sistema.</p>
            </div>
        </section>

        <section class="card">
            <h2>Listado de citas</h2>

            <table>
                <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Profesional</th>
                    <th>Servicio</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Estado</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="cita : ${citas}">
                    <td th:text="${cita.cliente.usuario.nombre}">Cliente</td>
                    <td th:text="${cita.profesional.usuario.nombre}">Profesional</td>
                    <td th:text="${cita.servicio.nombre}">Servicio</td>
                    <td th:text="${cita.fecha}">Fecha</td>
                    <td th:text="${cita.hora}">Hora</td>
                    <td>
                        <span class="badge"
                              th:classappend="${cita.estado.name() == 'PENDIENTE'} ? ' badge-pendiente' :
                                              (${cita.estado.name() == 'CONFIRMADA'} ? ' badge-confirmada' :
                                              (${cita.estado.name() == 'CANCELADA'} ? ' badge-cancelada' : ' badge-completada'))"
                              th:text="${cita.estado}">
                            Estado
                        </span>
                    </td>
                </tr>

                <tr th:if="${citas == null or #lists.isEmpty(citas)}">
                    <td colspan="6">No hay citas registradas.</td>
                </tr>
                </tbody>
            </table>
        </section>

    </main>

</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
